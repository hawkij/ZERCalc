[project]
name = "ZERCalc"
version = "0.0.1"
description = "Python-based model to aggregate energy resource demands of net-zero emissions plans across sectors and industries."
readme = "README.md"
requires-python = "==3.9"
license = { file = "LICENSE" }
authors = [
  {name = "Jennifer Hawkin"}
]

dependencies = [
  "numpy == 1.21.5",
  "pandas == 1.4.4",
  "matplotlib == 3.5.2",
  "xlrd == 2.0.1",
  "seaborn == 0.11.2",
  "notebook == 6.4.12",
  "jupyterlab == 4.4.5"
]
